name: Action tests

# Runs the shell test suites for composite actions AND repo scripts (e.g. the
# resolve-trivy-config security-gate resolver, and repo-template-sync's
# render-codeowners resolver). ShellCheck lints the scripts; this workflow
# actually executes their tests so a regression — a silently weakened vuln gate,
# or a CODEOWNERS resolver that mis-assigns ownership — cannot ship uncaught.

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/action-tests.yml"
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/action-tests.yml"

permissions:
  contents: read

jobs:
  action-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Some script test suites (render-codeowners) require mikefarah yq v4.
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Run shell test suites
        run: |
          shopt -s globstar nullglob
          found=0
          for t in .github/actions/**/*.test.sh .github/scripts/**/*.test.sh; do
            found=1
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No *.test.sh suites found under .github/actions/ or .github/scripts/"
          fi
