name: Action tests

# Runs the shell test suites for composite actions in this repo (e.g. the
# resolve-trivy-config security-gate resolver). ShellCheck lints the scripts;
# this workflow actually executes their tests so a regression that silently
# weakened the vulnerability gate cannot ship uncaught.

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/action-tests.yml"
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/action-tests.yml"

permissions:
  contents: read

jobs:
  action-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run composite action test suites
        run: |
          shopt -s globstar nullglob
          found=0
          for t in .github/actions/**/*.test.sh; do
            found=1
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No *.test.sh suites found under .github/actions/"
          fi
