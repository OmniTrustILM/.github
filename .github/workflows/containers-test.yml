name: Test Docker image (reusable)

# Reusable workflow for OmniTrustILM PR test builds.
# Builds the image locally for each target architecture and scans it with
# Trivy. Vulnerabilities only warn in a branch or pull request build and fail
# any other build, such as a tag; any other finding, such as a leaked secret,
# fails every build. A caller that grants checks: write also gets the verdict
# as a check run on the scanned commit, needing action when vulnerabilities only
# warn. Nothing is pushed.
#
# Optional pre-build:
#   - pre-build: 'maven'  -> runs `mvn clean package` once and shares the JARs
#                            with both per-arch builds via an `app-data.tar`
#                            artifact. Use this when the Dockerfile expects the
#                            JARs to already exist on disk.
#   - pre-build: 'none'   -> builds entirely inside the Dockerfile (default).

on:
  workflow_call:
    inputs:
      image:
        description: "Image repository path within the registry (e.g. ilm/core)"
        required: true
        type: string
      cache-scope:
        description: "Cache namespace shared by the per-arch builds (e.g. core)"
        required: true
        type: string
      # No namespace validation. Artifacts are resolved by exact name on both ends.
      artifact-namespace:
        description: |
          Prefix for every artifact this workflow writes. REQUIRED when one caller
          invokes this workflow more than once in the same run (e.g. a matrix over
          `uses:`), because artifact names are run-scoped: without it the calls
          collide on `app-data`. Empty (the default) keeps the historical unprefixed names.
        required: false
        type: string
        default: ''
      registry:
        description: "Container registry hostname"
        required: false
        type: string
        default: hub.omnitrustregistry.com
      dockerfile:
        description: "Path to the Dockerfile (relative to repo root)"
        required: false
        type: string
        default: ./Dockerfile
      build-args:
        description: "Multiline build args passed to docker/build-push-action"
        required: false
        type: string
        default: ''
      pre-build:
        description: "Pre-build artifact strategy: 'none' or 'maven'"
        required: false
        type: string
        default: 'none'
      java-version:
        description: "JDK version (used when pre-build=maven)"
        required: false
        type: string
        default: '21'
      trivy-config:
        description: "Path to a repo-local Trivy config that fully replaces the org default. Used ONLY when allow-trivy-config-override is true."
        required: false
        type: string
        default: config/trivy.yaml
      allow-trivy-config-override:
        description: "Allow this repo to fully replace the org-default Trivy policy with its own file at trivy-config. Default false = org policy enforced."
        required: false
        type: boolean
        default: false
      skip-tests:
        description: "Skip Maven tests during pre-build (use when tests already run in a prior workflow)"
        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref to check out (branch, tag, or SHA). Defaults to the calling workflow's ref."
        required: false
        type: string
        default: ''
      read-token-repositories:
        description: "Comma-separated repositories the build reads with a GitHub App token, such as a private Go module"
        required: false
        type: string
        default: ''
      read-token-owner:
        description: "Owner of read-token-repositories. Empty (the default) is the caller's owner."
        required: false
        type: string
        default: ''
      read-token-secret-id:
        description: "BuildKit secret id the build reads the token from"
        required: false
        type: string
        default: github_token
    secrets:
      # Needed only with read-token-repositories.
      READ_TOKEN_APP_ID:
        required: false
      READ_TOKEN_APP_PRIVATE_KEY:
        required: false

jobs:
  build_artifacts:
    name: Build app artifacts (once)
    if: ${{ inputs.pre-build == 'maven' }}
    runs-on: ubuntu-latest
    env:
      ARTIFACT_PREFIX: ${{ inputs.artifact-namespace != '' && format('{0}~', inputs.artifact-namespace) || '' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java + Maven cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Prepare data dir
        run: |
          rm -rf data
          mkdir -p data

      - name: Maven package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -f pom.xml -U -B -ntp -T 1C clean package ${{ inputs.skip-tests && '-DskipTests' || '' }}

      - name: Collect artifacts into tar (preserve perms)
        run: |
          mkdir -p data/target
          cp -a target/*.jar data/target/
          cp -a docker data/docker
          tar -cpf app-data.tar data

      - name: Upload artifact (tar)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_PREFIX }}app-data
          path: app-data.tar
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.arch }}
    needs: [build_artifacts]
    # Run even when build_artifacts is skipped (pre-build=none), but not when it fails.
    if: ${{ always() && (needs.build_artifacts.result == 'success' || needs.build_artifacts.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      ARTIFACT_PREFIX: ${{ inputs.artifact-namespace != '' && format('{0}~', inputs.artifact-namespace) || '' }}
    steps:
      - name: Validate read-token-repositories with ref
        if: ${{ inputs.read-token-repositories != '' && inputs.ref != '' }}
        run: |
          echo "::error::read-token-repositories cannot be combined with ref, because a ref build may run a fork's code"
          exit 1

      - name: Validate read-token-repositories entries
        if: ${{ inputs.read-token-repositories != '' }}
        env:
          REPOSITORIES: ${{ inputs.read-token-repositories }}
        run: |
          if [[ "$REPOSITORIES" =~ [^A-Za-z0-9._/,[:space:]-] || ! "$REPOSITORIES" =~ [A-Za-z0-9._/-] ]]; then
            echo "::error::read-token-repositories must list repository names, separated by commas or newlines"
            exit 1
          fi

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Download artifact (tar)
        if: ${{ inputs.pre-build == 'maven' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_PREFIX }}app-data

      - name: Extract artifacts (preserve perms)
        if: ${{ inputs.pre-build == 'maven' }}
        run: tar -xpf app-data.tar

      - name: Mint the read token
        id: read-token
        if: ${{ inputs.read-token-repositories != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.READ_TOKEN_APP_ID }}
          private-key: ${{ secrets.READ_TOKEN_APP_PRIVATE_KEY }}
          owner: ${{ inputs.read-token-owner }}
          repositories: ${{ inputs.read-token-repositories }}
          permission-contents: read

      - name: Build (${{ matrix.arch }}) - local only (no push)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ inputs.registry }}/${{ inputs.image }}:ci
          cache-from: type=gha,scope=${{ inputs.cache-scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=${{ inputs.read-token-repositories != '' && 'min' || 'max' }},scope=${{ inputs.cache-scope }}-${{ matrix.arch }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ steps.read-token.outputs.token != '' && format('{0}={1}', inputs.read-token-secret-id, steps.read-token.outputs.token) || '' }}

      # Resolve first so TRIVY_IGNOREFILE (set for the org-default gate) also
      # governs the informational report below — the report must reflect what
      # the gate enforces.
      - name: Resolve Trivy config
        id: trivy-config
        uses: OmniTrustILM/.github/.github/actions/resolve-trivy-config@main
        with:
          allow-trivy-config-override: ${{ inputs.allow-trivy-config-override }}
          trivy-config-path: ${{ inputs.trivy-config }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.image }}:ci
          format: json
          output: trivy-report-${{ matrix.arch }}.json
          scanners: "vuln,secret"
          exit-code: 0

      - name: Upload vulnerability report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_PREFIX }}trivy-report-${{ matrix.arch }}
          path: trivy-report-${{ matrix.arch }}.json

      # The verdict must read only what the gate step writes. Clearing the path
      # also drops a file an earlier write left there through a symlink in the
      # checkout.
      - name: Clear the gate report
        run: rm -f "${{ runner.temp }}/trivy-gate-${{ matrix.arch }}.json"

      # warn mode passes exit code 0, so findings do not fail this step and the
      # verdict below decides; enforce mode leaves it empty, so the policy's own
      # exit code applies. A scan error fails this step either way. The report
      # goes outside the checkout, so a file in the caller's repository can never
      # stand in for this scan's report.
      - name: Vulnerability gate
        id: vulnerability-gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.image }}:ci
          trivy-config: ${{ steps.trivy-config.outputs.config-file }}
          format: json
          output: ${{ runner.temp }}/trivy-gate-${{ matrix.arch }}.json
          exit-code: ${{ steps.trivy-config.outputs.gate-mode == 'warn' && '0' || '' }}
          skip-setup-trivy: true

      # Runs after a failed gate too, so a blocked build still lists its findings.
      - name: Vulnerability gate verdict
        if: ${{ !cancelled() && (steps.vulnerability-gate.outcome == 'success' || steps.vulnerability-gate.outcome == 'failure') }}
        uses: OmniTrustILM/.github/.github/actions/trivy-gate-verdict@main
        with:
          gate-mode: ${{ steps.trivy-config.outputs.gate-mode }}
          report-file: ${{ runner.temp }}/trivy-gate-${{ matrix.arch }}.json
          label: ${{ inputs.image }} ${{ matrix.arch }}
          gate-outcome: ${{ steps.vulnerability-gate.outcome }}
          # A pull request's head only when that is what was scanned; with a ref
          # override the verdict uses the checked-out commit.
          head-sha: ${{ inputs.ref == '' && github.event.pull_request.head.sha || '' }}
