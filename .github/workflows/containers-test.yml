name: Test Docker image (reusable)

# Reusable workflow for OmniTrustILM PR test builds.
# Builds the image locally for each target architecture, scans it with Trivy,
# and fails on policy violations. Nothing is pushed.
#
# Optional pre-build:
#   - pre-build: 'maven'  -> runs `mvn clean package` once and shares the JARs
#                            with both per-arch builds via an `app-data.tar`
#                            artifact. Use this when the Dockerfile expects the
#                            JARs to already exist on disk.
#   - pre-build: 'none'   -> builds entirely inside the Dockerfile (default).

on:
  workflow_call:
    inputs:
      image:
        description: "Image repository path within the registry (e.g. ilm/core)"
        required: true
        type: string
      cache-scope:
        description: "Cache namespace shared by the per-arch builds (e.g. core)"
        required: true
        type: string
      # No namespace validation. Artifacts are resolved by exact name on both ends.
      artifact-namespace:
        description: |
          Prefix for every artifact this workflow writes. REQUIRED when one caller
          invokes this workflow more than once in the same run (e.g. a matrix over
          `uses:`), because artifact names are run-scoped: without it the calls
          collide on `app-data`. Empty (the default) keeps the historical unprefixed names.
        required: false
        type: string
        default: ''
      registry:
        description: "Container registry hostname"
        required: false
        type: string
        default: hub.omnitrustregistry.com
      dockerfile:
        description: "Path to the Dockerfile (relative to repo root)"
        required: false
        type: string
        default: ./Dockerfile
      build-args:
        description: "Multiline build args passed to docker/build-push-action"
        required: false
        type: string
        default: ''
      pre-build:
        description: "Pre-build artifact strategy: 'none' or 'maven'"
        required: false
        type: string
        default: 'none'
      java-version:
        description: "JDK version (used when pre-build=maven)"
        required: false
        type: string
        default: '21'
      trivy-config:
        description: "Path to a repo-local Trivy config that fully replaces the org default. Used ONLY when allow-trivy-config-override is true."
        required: false
        type: string
        default: config/trivy.yaml
      allow-trivy-config-override:
        description: "Allow this repo to fully replace the org-default Trivy policy with its own file at trivy-config. Default false = org policy enforced."
        required: false
        type: boolean
        default: false
      skip-tests:
        description: "Skip Maven tests during pre-build (use when tests already run in a prior workflow)"
        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref to check out (branch, tag, or SHA). Defaults to the calling workflow's ref."
        required: false
        type: string
        default: ''

jobs:
  build_artifacts:
    name: Build app artifacts (once)
    if: ${{ inputs.pre-build == 'maven' }}
    runs-on: ubuntu-latest
    env:
      ARTIFACT_PREFIX: ${{ inputs.artifact-namespace != '' && format('{0}~', inputs.artifact-namespace) || '' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java + Maven cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Prepare data dir
        run: |
          rm -rf data
          mkdir -p data

      - name: Maven package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -f pom.xml -U -B -ntp -T 1C clean package ${{ inputs.skip-tests && '-DskipTests' || '' }}

      - name: Collect artifacts into tar (preserve perms)
        run: |
          mkdir -p data/target
          cp -a target/*.jar data/target/
          cp -a docker data/docker
          tar -cpf app-data.tar data

      - name: Upload artifact (tar)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_PREFIX }}app-data
          path: app-data.tar
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.arch }}
    needs: [build_artifacts]
    # Run even when build_artifacts is skipped (pre-build=none), but not when it fails.
    if: ${{ always() && (needs.build_artifacts.result == 'success' || needs.build_artifacts.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      ARTIFACT_PREFIX: ${{ inputs.artifact-namespace != '' && format('{0}~', inputs.artifact-namespace) || '' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download artifact (tar)
        if: ${{ inputs.pre-build == 'maven' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_PREFIX }}app-data

      - name: Extract artifacts (preserve perms)
        if: ${{ inputs.pre-build == 'maven' }}
        run: tar -xpf app-data.tar

      - name: Build (${{ matrix.arch }}) - local only (no push)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ inputs.registry }}/${{ inputs.image }}:ci
          cache-from: type=gha,scope=${{ inputs.cache-scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}-${{ matrix.arch }}
          build-args: ${{ inputs.build-args }}

      # Resolve first so TRIVY_IGNOREFILE (set for the org-default gate) also
      # governs the informational report below — the report must reflect what
      # the gate enforces.
      - name: Resolve Trivy config
        id: trivy-config
        uses: OmniTrustILM/.github/.github/actions/resolve-trivy-config@main
        with:
          allow-trivy-config-override: ${{ inputs.allow-trivy-config-override }}
          trivy-config-path: ${{ inputs.trivy-config }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.image }}:ci
          format: json
          output: trivy-report-${{ matrix.arch }}.json
          scanners: "vuln,secret"
          exit-code: 0

      - name: Upload vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_PREFIX }}trivy-report-${{ matrix.arch }}
          path: trivy-report-${{ matrix.arch }}.json

      - name: Fail build on vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.image }}:ci
          trivy-config: ${{ steps.trivy-config.outputs.config-file }}
          skip-setup-trivy: true
