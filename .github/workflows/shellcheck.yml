name: ShellCheck

# Lints all bash scripts in the repo on every PR and on pushes to main.
# Covers .github/scripts/ (used by workflows in this repo), .github/actions/
# (composite actions consumed by org repos), and .claude/skills/ (the committed
# Claude Code skills). The skills are linted with -x so shellcheck follows each
# script's `. _common.sh` source (resolved via source-path=SCRIPTDIR).

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/actions/**"
      - ".claude/skills/**"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/actions/**"
      - ".claude/skills/**"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck on scripts and actions
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .github
          severity: warning

      # Direct invocation (shellcheck is preinstalled on ubuntu-latest) so -x is
      # applied for certain — the sourcing scripts need it to resolve _common.sh.
      - name: Run shellcheck on Claude Code skills
        run: |
          shellcheck --version
          find .claude/skills -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck -x --severity=warning
