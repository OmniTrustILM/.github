name: Publish Harbor image (reusable)

# Reusable workflow for OmniTrustILM image publishes to a Harbor registry.
#
# Pattern:
#   1. (Optional) build_artifacts:  one-shot Maven build, shared via tar artifact.
#   2. build:                       per-arch build + push by digest only (no tags),
#                                   with provenance + SBOM + Trivy scan against the
#                                   pushed digest. Each run exports its digest as
#                                   a marker file.
#   3. publish_manifest:            collects all per-arch digests, creates the
#                                   multiarch manifest under each tag from
#                                   docker/metadata-action, then - when `sign`
#                                   is enabled - signs every digest and every
#                                   tag with cosign (tags are pushed before
#                                   signing so a transient signing failure
#                                   cannot leave tags unpublished).
#   4. push_readme:                  pushes the repo README to every published
#                                   image path, when `push-readme` is enabled.
#
# Adding a new architecture later means adding one entry to the matrix - the
# manifest job picks up any digests-* artifacts of its own namespace it finds.
#
# `artifact-namespace` is required when one caller invokes this workflow more than
# once in a single run - a per-variant matrix over `uses:`, say. Artifacts are
# scoped to the caller's RUN, not to the call, so two calls would both write
# `digests-amd64` and the second upload would fail on the duplicate name. Worse,
# each call's manifest job downloads `digests-*` with merge-multiple, so it would
# build its manifest from the other call's digests, under its own image path.
# Pass a distinct namespace per call (the variant name) and every artifact this
# workflow writes is prefixed with it. Empty (the default) keeps the historical
# names, so single-call callers need no change.
#
# `additional-images` publishes one build under several repository paths in the
# same registry. The build and the Trivy scan run once, against `image`.
#
# `ref` builds something other than the caller's own ref. A PR preview passes the
# PR head SHA, which resolves even for a fork: fork objects live in the base
# repository's network. Such a build is not a release, so it also passes
# `sign: false` and `push-readme: false`.

on:
  workflow_call:
    inputs:
      image:
        description: "Image repository path within the registry (e.g. ilm/core)"
        required: true
        type: string
      additional-images:
        description: |
          Extra image repository paths within the same registry, one per line,
          to publish this build under as well. The image is built and scanned
          ONCE against `image`; every path receives that same manifest and so
          resolves to the same digest. Tags, their cosign signatures and the
          README are published to each; the per-arch digests are signed under
          `image` only. Empty (the default) publishes to `image` alone.
        required: false
        type: string
        default: ''
      cache-scope:
        description: "Cache namespace shared by the per-arch builds (e.g. core)"
        required: true
        type: string
      artifact-namespace:
        description: |
          Prefix for every artifact this workflow writes. REQUIRED when one caller
          invokes this workflow more than once in the same run (e.g. a matrix over
          `uses:`), because artifact names are run-scoped: without it the calls
          collide on `digests-<arch>` and the manifest job mixes their digests.
          Empty (the default) keeps the historical unprefixed names.
        required: false
        type: string
        default: ''
      registry:
        description: "Container registry hostname"
        required: false
        type: string
        default: hub.omnitrustregistry.com
      registry-provider:
        description: "Provider for the README push action (harbor2, dockerhub, ...)"
        required: false
        type: string
        default: harbor2
      dockerfile:
        description: "Path to the Dockerfile (relative to repo root)"
        required: false
        type: string
        default: ./Dockerfile
      build-args:
        description: "Multiline build args passed to docker/build-push-action"
        required: false
        type: string
        default: ''
      pre-build:
        description: "Pre-build artifact strategy: 'none' or 'maven'"
        required: false
        type: string
        default: 'none'
      java-version:
        description: "JDK version (used when pre-build=maven)"
        required: false
        type: string
        default: '21'
      trivy-config:
        description: "Path to a repo-local Trivy config that fully replaces the org default. Used ONLY when allow-trivy-config-override is true."
        required: false
        type: string
        default: config/trivy.yaml
      allow-trivy-config-override:
        description: "Allow this repo to fully replace the org-default Trivy policy with its own file at trivy-config. Default false = org policy enforced."
        required: false
        type: boolean
        default: false
      tag-rules:
        description: |
          Multiline tag rules passed to docker/metadata-action. Default emits:
            - the tag name (for tag pushes)
            - {major}.{minor} and {major} (for semver tags)
            - 'latest' (for tag pushes)
            - 'develop-latest' + 'develop-<sha>' (for branch pushes)
          Override to customise per-repo.
        required: false
        type: string
        default: |
          type=ref,event=tag
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          type=raw,value=develop-latest,enable=${{ startsWith(github.ref, 'refs/heads/') }}
          type=sha,prefix=develop-,format=long,enable=${{ startsWith(github.ref, 'refs/heads/') }}
      ref:
        description: "Git ref to check out (branch, tag, or SHA). Defaults to the calling workflow's ref."
        required: false
        type: string
        default: ''
      sign:
        description: |
          Sign every published digest and tag with cosign. Pass false for a build
          that must not carry a release signature, such as a PR preview; the
          caller can then omit the COSIGN_* secrets altogether.
        required: false
        type: boolean
        default: true
      push-readme:
        description: |
          Push the checked-out README to every published image path. Pass false
          when the checkout is not the canonical README, such as a PR preview of
          a forked branch.
        required: false
        type: boolean
        default: true
    secrets:
      CONTAINER_REGISTRY_USERNAME:
        required: true
      CONTAINER_REGISTRY_PASSWORD:
        required: true
      # Optional so a caller passing sign: false never receives the signing key.
      # publish_manifest fails fast if they are missing while sign is enabled.
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false

jobs:
  build_artifacts:
    name: Build app artifacts (once)
    if: ${{ inputs.pre-build == 'maven' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java + Maven cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Prepare data dir
        run: |
          rm -rf data
          mkdir -p data

      - name: Maven package (skip tests; tests run on PR)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -f pom.xml -U -B -ntp -T 1C -DskipTests clean package

      - name: Collect artifacts into tar (preserve perms)
        run: |
          mkdir -p data/target
          cp -a target/*.jar data/target/
          cp -a docker data/docker
          tar -cpf app-data.tar data

      - name: Upload artifact (tar)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Run-scoped name: prefixed so parallel calls in one run stay apart.
          name: ${{ inputs.artifact-namespace && format('{0}-', inputs.artifact-namespace) || '' }}app-data
          path: app-data.tar
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build & push (${{ matrix.arch }})
    needs: [build_artifacts]
    if: ${{ always() && (needs.build_artifacts.result == 'success' || needs.build_artifacts.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download artifact (tar)
        if: ${{ inputs.pre-build == 'maven' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-namespace && format('{0}-', inputs.artifact-namespace) || '' }}app-data

      - name: Extract artifacts (preserve perms)
        if: ${{ inputs.pre-build == 'maven' }}
        run: tar -xpf app-data.tar

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build + push (${{ matrix.arch }}) by digest only (no tags)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ inputs.registry }}/${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.cache-scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}-${{ matrix.arch }}
          build-args: ${{ inputs.build-args }}

      - name: Export digest as marker file
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-namespace && format('{0}-', inputs.artifact-namespace) || '' }}digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # Resolve first so TRIVY_IGNOREFILE (set for the org-default gate) also
      # governs the informational report below — the report must reflect what
      # the gate enforces.
      - name: Resolve Trivy config
        id: trivy-config
        uses: OmniTrustILM/.github/.github/actions/resolve-trivy-config@main
        with:
          allow-trivy-config-override: ${{ inputs.allow-trivy-config-override }}
          trivy-config-path: ${{ inputs.trivy-config }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-report-${{ matrix.arch }}.json
          scanners: "vuln,secret"
          exit-code: 0

      - name: Upload vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-namespace && format('{0}-', inputs.artifact-namespace) || '' }}trivy-report-${{ matrix.arch }}
          path: trivy-report-${{ matrix.arch }}.json

      - name: Fail build on vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
          trivy-config: ${{ steps.trivy-config.outputs.config-file }}
          skip-setup-trivy: true

  publish_manifest:
    name: Publish multiarch manifest
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    env:
      IMAGE: ${{ inputs.registry }}/${{ inputs.image }}
    outputs:
      # JSON array of every published image path, consumed by push_readme.
      images: ${{ steps.targets.outputs.json }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Download per-arch digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          # Namespaced pattern: never collect another call's digests.
          pattern: ${{ inputs.artifact-namespace && format('{0}-', inputs.artifact-namespace) || '' }}digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      # metadata-action takes the whole list, so its `tags` output already spans
      # every path and the loops below need no per-path special-casing.
      - name: Resolve target image paths
        id: targets
        env:
          REGISTRY: ${{ inputs.registry }}
          PRIMARY: ${{ inputs.image }}
          ADDITIONAL: ${{ inputs.additional-images }}
        run: |
          set -euo pipefail

          paths=("${PRIMARY}")
          while IFS= read -r path; do
            # Tolerate blank lines and stray indentation in the caller's YAML block.
            path="${path//[[:space:]]/}"
            [ -z "$path" ] && continue
            paths+=("$path")
          done <<< "${ADDITIONAL}"

          # printf cycles its format over all arguments, so prefix one at a time.
          qualified=()
          for path in "${paths[@]}"; do
            qualified+=("${REGISTRY}/${path}")
          done

          {
            echo "list<<TARGETS_EOF"
            printf '%s\n' "${qualified[@]}"
            echo "TARGETS_EOF"
          } >> "$GITHUB_OUTPUT"

          json=$(printf '%s\n' "${qualified[@]}" \
            | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          echo "json=${json}" >> "$GITHUB_OUTPUT"

          echo "Publishing under:"
          printf '  %s\n' "${qualified[@]}"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.targets.outputs.list }}
          tags: ${{ inputs.tag-rules }}

      - name: Install Cosign
        if: ${{ inputs.sign }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Turns a missing or unusable secret into a clear configuration error
      # instead of an opaque cosign failure after the tags are already
      # published. Deriving the public key has to decrypt the private key, so
      # this covers COSIGN_PASSWORD as well, and still accepts a key that needs
      # no password.
      - name: Check the signing key is usable
        if: ${{ inputs.sign }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "::error::sign is enabled but COSIGN_PRIVATE_KEY is empty. Pass the COSIGN_* secrets, or call with sign: false."
            exit 1
          fi

          if ! cosign public-key --key env://COSIGN_PRIVATE_KEY > /dev/null; then
            echo "::error::The signing key could not be unlocked. Check COSIGN_PRIVATE_KEY and COSIGN_PASSWORD."
            exit 1
          fi

      - name: Create + push multiarch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          echo "Per-arch digest files:"
          ls -1

          # The per-arch manifests exist only under the primary path so far.
          SOURCES=()
          for digest_file in *; do
            SOURCES+=("${IMAGE}@sha256:${digest_file}")
          done

          echo "Tags to publish:"
          echo "${TAGS}"

          # The manifest is content-addressed, so a tag on an additional path
          # resolves to the same digest.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Publishing manifest: $tag"

            docker buildx imagetools create --tag "$tag" "${SOURCES[@]}"
            docker buildx imagetools inspect "$tag"
          done <<< "${TAGS}"

      # Separate from publication, and ordered after it, so that a transient
      # signing failure cannot leave tags unpublished.
      - name: Sign multiarch manifest and per-arch digests
        if: ${{ inputs.sign }}
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail

          SOURCES=()
          for digest_file in *; do
            SOURCES+=("${IMAGE}@sha256:${digest_file}")
          done

          # Primary path only: these digests are the intermediate per-arch
          # indexes that build pushed here, and imagetools copies just the leaf
          # manifests the final index references, so they do not exist under an
          # additional path. Those paths are covered by the tag loop below.
          for ref in "${SOURCES[@]}"; do
            echo "Signing per-arch image: $ref"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$ref"
          done

          # Every path needs its own signature here: cosign stores these as
          # sha256-<digest>.sig in the repository, and a signature written to one
          # repository does not verify from another.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Signing multiarch manifest tag: $tag"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$tag"
          done <<< "${TAGS}"

  push_readme:
    name: Push README (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [publish_manifest]
    if: ${{ !cancelled() && inputs.push-readme && needs.publish_manifest.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.publish_manifest.outputs.images) }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Push README to registry
        uses: christian-korneck/update-container-description-action@d36005551adeaba9698d8d67a296bd16fa91f8e8 # v1
        env:
          DOCKER_USER: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          DOCKER_PASS: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
        with:
          destination_container_repo: ${{ matrix.image }}
          provider: ${{ inputs.registry-provider }}
