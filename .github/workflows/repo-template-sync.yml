name: Repo Template Sync

# Aligns each target repo with the org templates:
#   Task 1: .github/release.yml            ← templates/release.yml
#   Task 2: .github/workflows/
#             issue-automation.yml         ← templates/caller-workflows/...
#             release-automation.yml       ← templates/caller-workflows/...
#   Task 3: .github/CODEOWNERS             ← rendered from config/repo-domains.yml
#             (domain maintainer team per repo; excluded repos untouched)
#
# One PR per repo, up to 3 commits (one per task, skipped if no diff).
# If all tasks are no-op for a repo, no PR is opened.
#
# CODEOWNERS precondition: a maintainers-*/qa team is honored as a code owner
# only if it has write access to the repo. Those team→repo grants are done
# MANUALLY, per repo, matched to the repos passed to a given dispatch — grant
# them before (or alongside) dispatching for those repos, or the rendered
# CODEOWNERS is inert (no reviewer requested, the entry flagged invalid).
#
# Self-excludes the .github repo itself.
#
# Opt-out levers:
#   - Close the bot's sync PR without merging → opts the repo out of ALL
#     tasks (release.yml + workflows + CODEOWNERS); respected on later runs.
#   - Add the repo to `exclude:` in config/repo-domains.yml → opts out of the
#     CODEOWNERS task ONLY; release.yml + workflows still sync. Use this for a
#     repo that hand-maintains its own CODEOWNERS. (A pre-existing non-sync
#     CODEOWNERS is also auto-skipped, but exclude: makes the intent explicit.)

on:
  workflow_dispatch:
    inputs:
      target_repos:
        description: '"all" or comma-separated repo names (e.g. core,auth)'
        required: true
        default: "all"
        type: string
      dry_run:
        description: "Dry run: report drift only, open no PRs"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: repo-template-sync
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.resolve.outputs.repos }}
      count: ${{ steps.resolve.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ILM_PROJECT_BOT_APP_ID }}
          private-key: ${{ secrets.ILM_PROJECT_BOT_PRIVATE_KEY }}
          owner: OmniTrustILM

      # Reuse resolve-targets.sh from release-yml-sync — same
      # non-archived repo list, self-exclusion, validation logic.
      - name: Resolve target repos
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_INPUT: ${{ inputs.target_repos }}
        run: .github/scripts/release-yml-sync/resolve-targets.sh

  sync:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.repos) }}
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ILM_PROJECT_BOT_APP_ID }}
          private-key: ${{ secrets.ILM_PROJECT_BOT_PRIVATE_KEY }}
          owner: OmniTrustILM
          repositories: |
            ${{ matrix.repo }}

      - name: Checkout .github (source of truth)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source

      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OmniTrustILM/${{ matrix.repo }}
          path: target
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      # render-codeowners.sh requires mikefarah yq v4. Pin it explicitly rather
      # than relying on the runner image (matches label-sync.yml / project-health-report.yml).
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Dry-run drift report
        if: ${{ inputs.dry_run }}
        env:
          REPO_NAME: ${{ matrix.repo }}
        run: source/.github/scripts/repo-template-sync/diff-all.sh

      - name: Sync repo to org template
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: OmniTrustILM/${{ matrix.repo }}
          REPO_NAME: ${{ matrix.repo }}
        run: source/.github/scripts/repo-template-sync/sync-all.sh

  summary:
    needs: [plan, sync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Run summary
        env:
          TARGET_COUNT: ${{ needs.plan.outputs.count }}
          DRY_RUN: ${{ inputs.dry_run }}
          SYNC_RESULT: ${{ needs.sync.result }}
        run: |
          {
            echo "## Repo Template Sync — Final Summary"
            echo ""
            echo "Target repos: $TARGET_COUNT"
            echo "Dry run: $DRY_RUN"
            echo "Sync job aggregate: $SYNC_RESULT"
            echo ""
            echo "_Note: with fail-fast disabled, individual repos may have succeeded even if aggregate is 'failure'. See per-repo sections above._"
          } >> "$GITHUB_STEP_SUMMARY"
