name: PR agent review - guard
description: >
  Credential-free gate. Resolves the pull request from either event shape,
  rejects fork heads and bot authors, validates the review command, and reports
  whether the run should continue. Invoked before any App token is minted.
outputs:
  proceed:   { description: "true when the run should continue",   value: "${{ steps.guard.outputs.proceed }}" }
  pr-number: { description: "Pull request number",                 value: "${{ steps.guard.outputs.pr-number }}" }
  head-sha:  { description: "Head commit SHA",                     value: "${{ steps.guard.outputs.head-sha }}" }
  base-ref:  { description: "Base branch name",                    value: "${{ steps.guard.outputs.base-ref }}" }
  effort:    { description: "light | standard | deep",             value: "${{ steps.guard.outputs.effort }}" }
  full:      { description: "true when a full pass was requested", value: "${{ steps.guard.outputs.full }}" }
runs:
  using: composite
  steps:
    - id: guard
      shell: bash
      run: ${{ github.action_path }}/guard.sh
