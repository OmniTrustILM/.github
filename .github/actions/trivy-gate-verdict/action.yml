name: Trivy gate verdict
description: >-
  Report what the vulnerability gate found, in the job summary, and decide
  what it means for the build. In warn mode vulnerabilities only warn and any
  other finding fails; in enforce mode the gate step's own exit code decides.
  When the caller grants checks: write, the verdict also becomes a check run
  on the scanned commit; it needs action when vulnerabilities only warn.

inputs:
  gate-mode:
    description: >-
      'warn' or 'enforce', from the resolve-trivy-config action. Any value
      other than 'warn' enforces.
    required: true
  report-file:
    description: Path to the JSON report the gate step wrote.
    required: true
  label:
    description: >-
      Names the summary heading, the annotation titles and the check run, such
      as the image and architecture; the check run of each label is replaced
      on a rescan, so every image scanned on a commit needs its own.
    required: false
    default: ''
  head-sha:
    description: >-
      Commit the check run goes on. Empty (the default) means the checked-out
      commit; the workflows pass a pull request's head when they scan it.
    required: false
    default: ''
  gate-outcome:
    description: >-
      Outcome of the gate step ('success' or 'failure'). After a failed gate
      step, a missing report adds no second error, and in enforce mode the
      findings get one error annotation with their counts.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Report the gate's findings
      shell: bash
      env:
        INPUT_GATE_MODE: ${{ inputs.gate-mode }}
        INPUT_REPORT_FILE: ${{ inputs.report-file }}
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_GATE_OUTCOME: ${{ inputs.gate-outcome }}
        INPUT_HEAD_SHA: ${{ inputs.head-sha }}
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/verdict.sh"
