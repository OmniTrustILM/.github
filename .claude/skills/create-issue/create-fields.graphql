# Mutations used by create.sh after `gh issue create`.
#
# Variables come from cache/project-fields.json + the issue node id
# returned by `gh issue create --json id`.
#
# Each mutation is invoked separately by create.sh with `gh api graphql -F`.

mutation AddItem($projectId: ID!, $contentId: ID!) {
  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
    item { id }
  }
}

mutation SetSingleSelectValue(
  $projectId: ID!
  $itemId:    ID!
  $fieldId:   ID!
  $optionId:  String!
) {
  updateProjectV2ItemFieldValue(input: {
    projectId: $projectId
    itemId:    $itemId
    fieldId:   $fieldId
    value:     { singleSelectOptionId: $optionId }
  }) {
    projectV2Item { id }
  }
}

mutation SetIssueType($issueId: ID!, $issueTypeId: ID!) {
  updateIssueIssueType(input: { issueId: $issueId, issueTypeId: $issueTypeId }) {
    issue { id }
  }
}

# Read the parent's own Project #5 single-select values, so create.sh can copy
# Version (and Module) down after the sub-issue link exists.
query ParentFieldValues($parentId: ID!) {
  node(id: $parentId) {
    ... on Issue {
      projectItems(first: 10) {
        nodes {
          project { id }
          fieldValues(first: 30) {
            nodes {
              ... on ProjectV2ItemFieldSingleSelectValue {
                field { ... on ProjectV2SingleSelectField { name } }
                name
              }
            }
          }
        }
      }
    }
  }
}

mutation AddSubIssue($issueId: ID!, $subIssueId: ID!) {
  addSubIssue(input: { issueId: $issueId, subIssueId: $subIssueId }) {
    issue { number }
    subIssue { number }
  }
}
