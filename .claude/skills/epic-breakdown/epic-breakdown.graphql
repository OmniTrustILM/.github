# GraphQL operations for the epic-breakdown skill.
#
# Each operation is invoked individually by the skill's shell scripts via the
# same awk-extraction pattern create-issue uses:
#   gh api graphql -f query="$(awk '/^mutation AddSubIssue/,/^}$/' epic-breakdown.graphql)" -f issueId=...
# The operation's closing brace is the only line that is exactly "}" at column 0
# (inner braces are indented), so the awk range captures one operation cleanly.
#
# Self-contained on purpose: AddItem / SetSingleSelectValue / SetIssueType mirror
# create-issue/create-fields.graphql so this skill has no cross-skill dependency.

mutation AddItem($projectId: ID!, $contentId: ID!) {
  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
    item { id }
  }
}

mutation SetSingleSelectValue($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
  updateProjectV2ItemFieldValue(input: {
    projectId: $projectId
    itemId:    $itemId
    fieldId:   $fieldId
    value:     { singleSelectOptionId: $optionId }
  }) {
    projectV2Item { id }
  }
}

mutation SetNumberValue($projectId: ID!, $itemId: ID!, $fieldId: ID!, $number: Float!) {
  updateProjectV2ItemFieldValue(input: {
    projectId: $projectId
    itemId:    $itemId
    fieldId:   $fieldId
    value:     { number: $number }
  }) {
    projectV2Item { id }
  }
}

mutation SetIssueType($issueId: ID!, $issueTypeId: ID!) {
  updateIssueIssueType(input: { issueId: $issueId, issueTypeId: $issueTypeId }) {
    issue { id }
  }
}

mutation AddSubIssue($issueId: ID!, $subIssueId: ID!) {
  addSubIssue(input: { issueId: $issueId, subIssueId: $subIssueId }) {
    issue { number }
    subIssue { number }
  }
}

mutation AddBlockedBy($issueId: ID!, $blockingIssueId: ID!) {
  addBlockedBy(input: { issueId: $issueId, blockingIssueId: $blockingIssueId }) {
    issue { number }
    blockingIssue { number }
  }
}

query IssueParent($id: ID!) {
  node(id: $id) {
    ... on Issue { number parent { id number } }
  }
}

query EpicState($owner: String!, $repo: String!, $number: Int!) {
  repository(owner: $owner, name: $repo) {
    issue(number: $number) {
      id
      number
      title
      body
      state
      issueType { name }
      labels(first: 30) { nodes { name } }
      projectItems(first: 10) {
        nodes {
          id
          project { number }
          fieldValues(first: 50) {
            nodes {
              __typename
              ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2FieldCommon { name } } }
              ... on ProjectV2ItemFieldNumberValue        { number field { ... on ProjectV2FieldCommon { name } } }
              ... on ProjectV2ItemFieldDateValue          { date field { ... on ProjectV2FieldCommon { name } } }
            }
          }
        }
      }
      subIssues(first: 100) {
        nodes {
          id
          number
          title
          state
          issueType { name }
          labels(first: 30) { nodes { name } }
          repository { nameWithOwner }
          projectItems(first: 5) {
            nodes {
              project { number }
              fieldValues(first: 50) {
                nodes {
                  __typename
                  ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2FieldCommon { name } } }
                }
              }
            }
          }
        }
      }
      subIssuesSummary { total completed percentCompleted }
    }
  }
}
